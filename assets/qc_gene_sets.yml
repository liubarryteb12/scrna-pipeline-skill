# QC 基因集合 —— 血红蛋白（红细胞污染）与核糖体基因
#
# **为什么是精确基因名而不是前缀**（审计 M15，R-03 裁决）：
# `01_qc.py` 原来用 `var_names.str.startswith(("HBA","HBB",...))` 判断
# 血红蛋白基因。前缀匹配会**误收**：
#   - `HBEGF`（heparin-binding EGF-like growth factor）以 `HBE` 开头
#     → 被算进 `pct_counts_hb`，而这个基因与红细胞毫无关系；
#   - `RPSA`（ribosomal protein SA 的旧名，实为层粘连蛋白受体前体）
#     以 `RPS` 开头 → 被算进核糖体比例。
# 后果不是报错，而是**指标本身偏了**：`pct_counts_hb` 偏大 → 按它过滤会
# 误删真细胞；`pct_counts_ribo` 偏大 → 同样的阈值删掉更多细胞。
# 两者都"看起来正常"，因为百分比的量级没有变。
#
# 前缀匹配的诱因是"基因名列表太长，写前缀省事" —— 但省下的那点篇幅，
# 换来的是一个**没人能复核的指标定义**。这里把列表写全。
#
# 维护说明：本文件是 QC 指标的**定义**，改动它等于改动 `pct_counts_hb` /
# `pct_counts_ribo` 的语义 —— 改完必须重跑并对比分布，不能只看图变没变。

# 人（Homo sapiens）。HGNC 的 HBA/HBB 基因家族全名：
#   血红蛋白 α 簇：HBA1 HBA2 HBM HBA@（HBA@ 是旧占位符，不在现代注释里）
#   血红蛋白 β 簇：HBB HBD HBE1 HBG1 HBG2 HBBP1
#   血红蛋白 θ/ζ：HBQ1 HBZ
# `HBE1` 与 `HBE2`（后者是已废弃名）要写全名 —— 写 `HBE` 前缀就会收 HBEGF。
human_hb_genes:
  - HBA1
  - HBA2
  - HBB
  - HBD
  - HBE1
  - HBG1
  - HBG2
  - HBM
  - HBQ1
  - HBZ
  - HBBP1        # β 簇假基因，仍随红细胞污染一起变化

# 小鼠（Mus musculus）。注意小鼠基因名首字母大写：
#   Hba-a1 Hba-a2 Hbb-b1 Hbb-b2 Hbb-bh1 Hbb-bh2 Hbb-bt Hbe1 Hbg1 Hbg2 Hbq1 Hbz
mouse_hb_genes:
  - Hba-a1
  - Hba-a2
  - Hbb-b1
  - Hbb-b2
  - Hbb-bh1
  - Hbb-bh2
  - Hbb-bs
  - Hbb-bt
  - Hbe1
  - Hbg1
  - Hbg2
  - Hbq1
  - Hbz

# 核糖体蛋白基因。前缀 `RP` 看似干净，但 `RPSA`（ribosomal protein SA）
# 实际上编码 67 kDa 层粘连蛋白受体前体，功能上不是核糖体组分；
# `RPLP0`/`RPLP1`/`RPLP2` 是酸性核糖体磷蛋白，随核糖体一起变化，保留。
# 人：RPS1..RPS29 + RPL1..RPL41 家族（去掉已废弃的 RPSA/RPLP0 歧义项）。
# 这里列的是**常用且明确属于核糖体**的那批；未列出的 RP* 基因会被漏掉，
# 所以下面 `ribo_prefix_fallback` 记录了"漏掉"的规模，让读者能判断影响。

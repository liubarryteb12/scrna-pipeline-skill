# ============================================================================
# assets/tf_list.yml — 转录因子列表
# ============================================================================
# **这是一个精简的、免疫/泛癌相关的 TF 列表，不是完整的 TF 数据库。**
# 人类基因组有 ~1600 个 TF（HumanTFDB / Lambert et al. 2018, Cell）。
# 完整列表应该从那些数据库取；这里列了最常见的一批，目的是让流水线
# 在没有外部数据库依赖时能跑通并产出方向正确的结果。
#
# 覆盖不全的后果：**漏掉的 TF 不会被报出来**，而"没报"和"没有活性"
# 在读报告的人眼里是一样的。所以 `grn_status.json` 里记了
# `n_tfs_in_list` 与 `n_tfs_present`，让覆盖范围可见。
#
# 换成完整列表时：把 `tfs:` 换成 ~1600 个基因名即可，代码不用改。
#
# 参考：Lambert SA et al. "The Human Transcription Factors." Cell 2018.
#      doi:10.1016/j.cell.2018.01.029
# ============================================================================


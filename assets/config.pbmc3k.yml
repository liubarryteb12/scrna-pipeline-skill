# ============================================================================
# assets/config.pbmc3k.yml — 单细胞流水线配置
# ============================================================================
# **这个配置对应的是"验证流水线本身"用的健康对照数据集，不是疾病数据。**
# 它跑出的细胞类型比例没有生物学结论。换成真实疾病数据集时：
#   1. 复制本文件为 assets/config.<你的数据集>.yml
#   2. 改 dataset_id 和 source（见 assets/datasets.yml 的说明）
#   3. 如果有分组/批次信息，填 design 段（否则拟bulk DE 会自动跳过并记录原因）
#
# 与 Part 1（geo-normal-pipeline-skill）的对应关系：
#   dataset_id    -> 派生 results/<id> 与 data/<id>，一个数据集一个产物目录
#   analysis.seed -> 不可删；单细胞里 UMAP/leiden/scrublet 全都吃随机数
# ============================================================================

dataset_id: pbmc3k

# ---- 数据来源 ---------------------------------------------------------------
source:
  dataset: pbmc3k          # assets/datasets.yml 里的键
  # 也可以直接给直链（绕过登记表）：
  #   kind: h5ad
  #   url: https://.../my_disease_data.h5ad

# ---- 实验设计 ---------------------------------------------------------------
# 单细胞没有"两组对比"这种天然结构，分组信息来自样本元数据。
# **没有就留空** —— 留空时拟bulk DE 会记 not_configured 并说明原因，
# 而不是静默跳过（Part 1 规则 24 的同一条道理）。
design:
  # 样本（供体/条件）所在的 obs 列。10x 单样本数据里通常没有，留 null。
  sample_key: null
  # 分组所在的 obs 列（如 condition / disease / treatment）
  group_key: null
  # 对照组的取值（拟bulk DE 里作为 reference level）
  reference_group: null
  # 批次列（多供体/多批次整合用）
  batch_key: null

# ---- QC ---------------------------------------------------------------------
qc:
  min_genes: 200           # 每个细胞至少表达的基因数
  max_genes: 6000          # 双细胞/多倍体通常表现为基因数异常高
  max_pct_mt: 10           # 线粒体比例上限（死细胞/破损细胞高）
  min_cells: 3             # 每个基因至少在几个细胞里表达
  scrublet: true           # 双细胞检测（scanpy 内置，需要 scikit-image）
  # ambient RNA（胞外游离 RNA 污染）：
  #   none        —— 不做，并在状态里写明原因
  #   simple      —— 用"每个细胞的计数分布 vs 空液滴"做粗略估计（无空液滴时不可用）
  ambient_rna: none

# ---- 标准化与高变基因 -------------------------------------------------------
norm:
  target_sum: 10000
  n_top_genes: 2000
  # seurat_v3 吃原始计数、不需要先 log —— 这是它与另外两种口味的关键区别
  hvg_flavor: seurat_v3

# ---- 降维与聚类 -------------------------------------------------------------
reduce:
  n_pcs: 40
  n_neighbors: 15
  resolution: 1.0
  # 用多少个 PC 算邻居。null = 用全部 n_pcs。
  # 给一个数会覆盖 n_pcs —— 通常看 PCA 方差图后调小（如 20）。
  n_pcs_use: null

# ---- 批次整合 ---------------------------------------------------------------
integration:
  method: none             # none | harmony | combat
  # 单样本数据没有批次，method=none 是**正确的选择**而不是"偷懒"。
  # 多供体数据必须设 method=harmony 并把 design.batch_key 填上，
  # 否则聚类会被供体差异主导 —— 那是技术差异，不是细胞类型差异。

# ---- 轨迹 -------------------------------------------------------------------
trajectory:
  enabled: true
  # 起点簇。null = 取 CytoTRACE GCS 最高的细胞所在簇（会记在状态里）。
  # **旧版是按 PAGA 连通度挑的，实测在 PBMC3k 上挑中了浆细胞（终末分化）
  #   当根 —— 连通度高只说明"在图上居中"，居中既可能是祖细胞也可能是终末态。
  #   改用分化潜能分选根后，DPT 与 GCS 的相关从 +0.25 升到 +0.59。**
  root_cluster: null

  # 方向参考基因（生物学判据）。**两个都填才会启用**。
  # 拟时序的符号是任意的：DPT 从根出发，根选早或选晚，整条轴就反过来。
  # 只给一个方向参考时退回 CytoTRACE 分化潜能分，并在产物里写明。
  #
  # 本数据集是健康 PBMC（成熟外周血单个核细胞），**没有真正的发育轨迹** ——
  # 任何"轨迹"都是连续状态变化（如单核细胞活化）而非分化。所以这里刻意
  # 留空，让产物明确记录"方向来自 CytoTRACE 而非 marker"，而不是编一套
  # marker 出来假装有生物学依据。做真实发育数据时在这里填。
  early_markers: null
  late_markers: null

# ---- 细胞通讯 ---------------------------------------------------------------
communication:
  enabled: true
  # 用哪些簇做通讯分析。null = 全部。
  clusters: null

# ---- 转录因子调控 -----------------------------------------------------------
grn:
  enabled: true
  # 每个簇报告前几个 TF
  top_tfs: 10

# ---- 虚拟敲除 / 过表达（文档 §1.7 / §1.8）-----------------------------------
# **保留框架。** 规范把候选靶基因的产出留给 Part 1（R），跨部分只走 CSV
# （§0.2）。所以 targets_csv 指向 Part 1 交接出来的基因表；没有它时回退到
# 内部调控子（按簇特异性取前 top_n 个），此时 signature_alignment 为空。
perturbation:
  enabled: true
  # 用哪个引擎。三个值：
  #   both（默认）  = 一阶近似 + 真 scTenifoldKnk，两法各自落盘 + 一张一致性表
  #   first_order   = 只跑一阶单跳线性传播（秒级，有细胞类型分辨率）
  #   tenifold      = 只跑真 scTenifoldKnk（R/CRAN，分钟级，无细胞类型分辨率）
  # **拼错不会静默退回默认** —— 会直接报错，否则"我配了 tenifold"会变成假话。
  engine: both
  # Part 1 交接的候选靶基因 CSV，相对路径按 data_dir 解析。
  # 需要一列 gene（或 target / symbol），可选一列 logFC（或 log2FC）。
  # 该文件不存在时回退到内部调控子，并在状态里写明回退了。
  targets_csv: null
  # 回退时取前几个调控子
  top_n: 20
  # 过表达抬高多少个标准差
  overexpress_sd: 1.0
  # ---- scTenifoldKnk 参数 ----------------------------------------------------
  # **max_genes 是唯一真正要紧的旋钮**：它决定跑不跑得完。scTenifoldNet
  # README 的实测表（细胞 x 基因 -> 耗时）：300x1000 = 3.5 min；
  # 1000x5000 = 2 h 52 min / 9.2 GB；7500x7500 = 10 h 16 min / 22.6 GB。
  # 本数据是 2652 细胞 x 13714 基因，全基因集绝对跑不动（CI job 上限 45 min）。
  # **候选敲除基因不受这个上限约束** —— 它们必须全部进网络，否则 R 侧直接
  # stop（包对不在网络里的 gKO 不跳过）。上限只用来补足其余名额。
  tenifold:
    max_genes: 600
    n_net: 10            # 包默认：建几个子网络做张量分解
    n_cells: 500         # 包默认：每个网络有放回抽多少细胞
    n_comp: 3            # 包默认：PC 回归主成分数
    td_k: 3              # 包默认：张量分解秩
    ma_n_dim: 2          # 包默认：流形对齐维度
    n_cores: 1           # CI 钉单线程（与 workflow 的 env 一致）
    timeout_sec: 1500    # 单个 R 进程上限；CI job 45 min，留足余量

# ---- 分析选项 ---------------------------------------------------------------
analysis:
  seed: 20260919           # 不可删：UMAP / leiden / scrublet 全部吃随机数
  # **300 是投稿底线，别往下调。** 原来写 150：183 mm 宽的图只有 1080 px，
  # 放大或印刷后字形和细线发虚 —— 而"发虚"从图注上看不出来，文件大小也正常。
  # 实测通讯热图 6.05 in 宽在 150 dpi 下是 907 px、300 dpi 下是 1814 px。
  # **这个键会覆盖 common.py 的默认值**（`setdefault` 只在键缺失时才生效），
  # 所以只改 common.py 对这份配置没有任何作用 —— 两处都要对。
  figure_dpi: 300
  # 报告 marker 时每个簇取前几个
  top_markers: 25
  # 细胞类型注释：marker 打分用哪套签名（assets/celltype_markers.yml）
  celltype_markers: default

name: scRNA analysis

# ============================================================================
# 单细胞流水线 CI
# ============================================================================
# 设计原则（与 geo-normal-pipeline-skill 一致）：
#
#   1. **静态检查在前，装依赖在后。** 语法错误/规则违反 1 秒就能发现，
#      不该等 3 分钟装完 scanpy 才知道。
#
#   2. **产物必须上传。** 跑通但拿不到结果是没用的 —— 这条踩过坑：
#      artifact 的 path 清单和脚本实际写出的文件是两份独立的列表，
#      不一致时 job 绿但用户下载后缺文件。用 check_artifact_paths.mjs 兜住。
#
#   3. **图的检查在跑完之后。** 空白图只有真画出来才知道。
#
#   4. **可选步骤失败不让 job 变红，但要在验收清单里可见。**
#
#   5. 触发路径过滤：改 *.md / references/ 不触发 CI（省时间）。
#      **改了 scripts/ 或 workflow 本身才跑。**
# ============================================================================

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/scrna_analysis.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/scrna_analysis.yml"
  workflow_dispatch:
    inputs:
      config:
        description: "配置文件路径"
        required: false
        default: "assets/config.pbmc3k.yml"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 自设上限。GitHub 托管的硬上限是 6 小时；实测全流程 3-5 分钟，
    # 给 45 分钟留足余量（含装依赖）。
    timeout-minutes: 45

    # 把浮点结果钉死。**这是"设了种子也没用"的那一类随机源**，
    # 和 UMAP/leiden/scrublet 那些"没设种子"的不是一回事。
    #
    # **实测（六轮 CI，同一 Python 3.12、同一批包版本）**：
    #
    #   commit      并行度            dpt       palantir   scfates   拓扑     平均 rho
    #   8f3f56c0   无钉              +0.5856   +0.4674   +0.5644   4/6     +0.6363
    #   9af13b42   无钉              +0.5856   +0.4674   +0.5296   6/8     +0.6254  <- 只改注释
    #   5b241a3    下面 1)+2)        +0.5856   +0.4674   +0.5328   6/8     +0.6265
    #   db778bb    下面 1)+2)+3)     +0.5856   +0.4674   +0.5328   6/8     +0.6265
    #   f99eab1    同上              +0.5856   +0.4674   +0.5328   6/8     +0.6265
    #   e549477    同上              +0.5856   +0.4674   +0.5646   6/8     +0.6353
    #
    # **下面这三组变量不足以让 scFates 的 rho 可复现**（最后一行几乎回到
    # 未钉时的 +0.5644）。两次归因都被否证：
    #
    #   1) "多线程 BLAS 归约顺序" —— 钉住 1)+2) 后仍从 +0.5296 变 +0.5328
    #   2) "pynndescent 的 Numba 并行" —— 补上 3) 后三轮仍给
    #      +0.5328 / +0.5328 / +0.5646
    #
    # **它们确实修好了一件事：离散的拓扑稳住了** —— A 轮是 4 片段/6
    # milestone，之后六轮全部是 6 片段/8 milestone。所以不是白做，
    # **但不要以为设了就可复现。**
    #
    # `dpt` 与 `palantir` 六轮逐位相同，说明变量只在 scFates 那条路径上。
    # 残留随机源**尚未定位** —— 第三次动手前先读日志（AGENTS 规则 12），
    # 并把 `trajectory_status.json` 的 `reproducibility` 一起更新。
    #
    # 根因线索：`scFates.pp.diffusion`（1.2.5）**签名里没有 seed**，
    # 内部走 `palantir.run_diffusion_maps` → `compute_kernel(backend="scanpy")`
    # → scanpy 默认 `method="umap"`；然后 simpleppt 的 PPT 主曲线树
    # 把上游的末位差异放大成可见的 rho 变化。
    env:
      # 1) 线程数：多线程归约的求和顺序取决于线程调度，每次运行都不同。
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      # 2) 内核选择：OpenBLAS 在**运行期**按检测到的 CPU 型号分发 SIMD 内核
      #    （SSE/AVX2/AVX512 向量宽度不同 → 归约顺序不同 → 末位不同）。
      #    这一层线程数管不到；GitHub 托管 runner 的 CPU 型号在同一
      #    Azure 区域内也不单一。钉住内核类型后不再取决于宿主 CPU。
      OPENBLAS_CORETYPE: Haswell
      # 3) Numba 的线程池。**和上面两组是三个独立的旋钮** ——
      #    Numba 的 `prange` 线程数由它控制，不走 OMP/MKL。
      #    **但实测它也没解决 scFates 的漂移**（见上表最后一行）。
      NUMBA_NUM_THREADS: 1
      # 3b) Numba 的**线程层**（另一个独立旋钮：3) 管"几个线程"，
      #     3b) 管"用哪套线程运行时"）。钉死为 `workqueue` —— Numba
      #     自带的纯 Python 线程池，**完全不碰 OpenMP**。
      #
      #     起因是 E-52：`run_scrublet` 偶发 SIGSEGV（exit 139）。崩溃
      #     点在 `sc.pp.scrublet` 内部，而它的归一化那一步走的是
      #     `_scrublet/pipeline.py:35` 的 `zscore()` →
      #     `fast_array_utils.stats.mean_var` → `_mean_var.py:90/120`
      #     的 `sparse_mean_var_*`，那两个函数带 `numba.prange`，且头上
      #     挂的是 **`fast_array_utils.numba.njit`** —— 它会**同时编译
      #     `parallel=True` 与 `parallel=False` 两个版本**并按运行环境
      #     分派；Linux 主线程上永远选 `parallel=True`，于是**真实启动
      #     Numba 的并行运行期**（本地实测：调用前 `threading_layer()`
      #     未初始化，调用后变成 `omp`）。
      #
      #     注意这**不是** `_normalization.py` 的 `_normalize_csr` —— 那
      #     个是裸 `@njit`，它的 `prange` 其实退化成串行、不启动线程层。
      #     我第一版 E-52 就是只看后者而误判"Numba 无关"，见台账。
      #
      #     选 `workqueue` 的依据：`fast_array_utils` **自己**在
      #     `fast_array_utils/numba/__init__.py:117-120` 的告警里就把
      #     `NUMBA_THREADING_LAYER=workqueue` 列为推荐规避手段
      #     （原文："Detected an unsupported numba parallel runtime.
      #     ... Set `NUMBA_THREADING_LAYER=workqueue` or install `tbb`"）。
      #     本地实测：workqueue 可被真正选中，且 `mean_var` 结果与 omp
      #     **逐位相同**（不是"换个近似"，是换一套等价线程池）。
      #     环境变量只在**导入时**读取，所以必须放这里。
      NUMBA_THREADING_LAYER: workqueue
      # 4) 崩溃取证。`run_scrublet`（`sc.pp.scrublet`）会以约 1/5 的概率
      #    让整个进程 **SIGSEGV 退出（exit 139）**，而 native 崩溃**直接杀
      #    进程**：`01_qc.py:85` 的 `except Exception` 接不住，日志里只有
      #    一行 `Segmentation fault (core dumped)`，**没有任何 Python 栈**。
      #    打开 faulthandler 后，崩溃时会把**崩溃线程的逐帧 Python 栈**
      #    打到 stderr —— 这是定位"崩在哪一行"的唯一手段（本地实测：
      #    不设时零输出，设了以后打出 `Current thread … (most recent call
      #    first):` 的完整栈）。
      #    **纯取证开关，不改变任何计算**；必须在进程启动前生效，所以
      #    只能放这里 —— 在 `common.py` 里补已经太晚（`01_qc.py:26` 的
      #    `import scanpy` 早于 L28 的 `from common import …`）。
      #    **3b) 只是"降低概率"，没有证明修好** —— 所以这一条继续留着，
      #    等它再崩时给出真正的栈。见 `governance/15_ERROR_LEDGER.md` E-52。
      PYTHONFAULTHANDLER: 1

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          # **不用 3.13/3.14。** harmonypy 等包在新版本上还没有 wheel，
          # 要从源码编译，且编译时常因缺 numpy 头文件失败（本地实测过）。
          # 3.12 上这些包都有现成 wheel。
          python-version: "3.12"

      # ---- R 层：只为真 scTenifoldKnk 而装 ----------------------------------
      #
      # 装 R 的**唯一**目的是 08_virtual_perturbation.py 的 tenifold 引擎。
      # 其余全流程是纯 Python。
      #
      # **为什么以前没装**：`scTenifoldKnk` 不在 PyPI，于是"装不上"被写成了
      # 状态文件里的不可用理由。那条理由是**真的**，结论**越界了** ——
      # 它在 CRAN 上（v1.1，`NeedsCompilation: no`），能不能用取决于 CI 里
      # 有没有 R，而不是取决于它有没有 Python wheel。（K-01b）
      #
      # 系统库清单照抄 geo-normal-pipeline-skill —— 少一个就会在装
      # igraph / enrichR 的传递依赖时源码编译失败，而失败信息只提那个包名，
      # 不会告诉你缺的是 libxml2。
      - name: 装 R 的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: 设置 R
        uses: r-lib/actions/setup-r@v2
        with:
          # **用 release，不钉 4.3.0**（与 geo 一致，理由见 geo_analysis.yml）：
          # Posit P3M 的二进制是按**当前** R 构建的，runner 是 ubuntu-24.04
          # (noble)；钉旧版会退化成全量源码编译，而 scTenifoldNet 带
          # RcppArmadillo（`NeedsCompilation: yes`），源码编译要十几分钟。
          r-version: 'release'
          use-public-rspm: true

      # **改了下面的 packages 列表就必须递增这个 vN。**
      # cache key 一旦存在就不再写回 —— 沿用旧 key 时新装的包每次被丢掉，
      # 于是每轮 CI 都重装一遍，看起来像"缓存没命中"，其实是 key 没换。
      - name: 缓存 R 包
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-sc-tenifold-v1
          restore-keys: |
            rlib-${{ runner.os }}-

      - name: 安装 R 包（scTenifoldKnk）
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::scTenifoldKnk
            any::scTenifoldNet
            any::Matrix
            any::jsonlite
          cache-version: 1

      - name: 记录 R 环境
        # continue-on-error：这一步只是留证据，不该因为它失败就让整条流水线变红。
        continue-on-error: true
        run: |
          Rscript -e 'cat("R", as.character(getRversion()), "\n")'
          Rscript -e 'for (p in c("scTenifoldKnk","scTenifoldNet","Matrix","jsonlite")) cat(sprintf("  %-16s %s\n", p, if (requireNamespace(p, quietly=TRUE)) as.character(packageVersion(p)) else "MISSING"))'

      - name: 自检 R 引擎（方向断言 + 读写契约）
        # **这一步不跑流水线**，只跑 tenifold_knk.R 自己的 --selftest：
        # 六条断言里有三条是"转置必须被拦住"，而转置**不会报错** ——
        # 它会照常建出一个垃圾网络、所有状态字段看起来都正常。
        # 所以这条检查必须独立于流水线存在，流水线跑绿也证明不了它。
        run: Rscript scripts/lib/tenifold_knk.R --selftest

      - name: 静态检查（不装依赖）
        run: |
          node tools/check_py_syntax.mjs
          node tools/check_artifact_paths.mjs
          # 图例必须在图框外右侧、纵向排列（规则 26，用户约定 v2）。
          # 既有检查器全都看不见图例位置 —— 图例压在数据点上的图，
          # 在"文件存在 / 有墨迹 / 图名合规 / 配色合规 / 图幅合规"眼里都是合格的。
          node tools/check_legend_convention.mjs
          # R 脚本的静态检查 + **R↔Python 的 CLI 契约**。
          # 后者是重点：R 的 DEFAULTS 参数名、Python 的 --xxx 拼写、R 写出的
          # 文件名、Python 读回的文件名，分布在两个语言里，**没有任何编译器
          # 能发现它们不一致**，而失败方式都是"看起来像 R 崩了"。
          node tools/check_r_syntax.mjs

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import scanpy, anndata, pydeseq2; print('核心依赖 OK')"

      - name: 显示环境
        run: |
          python -c "
          import importlib
          for m in ['scanpy','anndata','pydeseq2','harmonypy','skmisc','skimage',
                    'leidenalg','palantir','scFates']:
              try:
                  importlib.import_module(m); print('  OK  ', m)
              except Exception as e:
                  print('  --  ', m, type(e).__name__)
          "

      - name: 跑流水线
        run: |
          python scripts/main_analysis.py --config ${{ github.event.inputs.config || 'assets/config.pbmc3k.yml' }}

      - name: 自检拟bulk DE 代码路径
        # 单样本数据集会让 04 正确记 not_configured 并跳过 —— 那验证了
        # "正确跳过"，但没验证真正的 DESeq2 代码。这一步把它跑到。
        run: |
          python tools/selftest_pseudobulk.py --config ${{ github.event.inputs.config || 'assets/config.pbmc3k.yml' }}

      - name: 自检 §0.2 跨语言交接代码路径
        # 默认配置的 `perturbation.targets_csv` 是 null，所以每轮走的都是
        # **回退分支**（internal_top_regulons）—— 那验证了"正确回退"，
        # 但没验证真正的交接代码路径，包括 `record_cross_language()`
        # 到底有没有被调用。这一步造一份假的 Part 1 交接表把它跑到。
        #
        # **这条自检是有来历的**：`record_cross_language()` 在 `common.py`
        # 里定义了很久但一次都没被调用，清单的 `cross_language` 永远是
        # 空数组 —— 而空数组和"这一轮没有跨语言转换"长得一模一样。
        run: |
          python tools/selftest_part1_handoff.py --config ${{ github.event.inputs.config || 'assets/config.pbmc3k.yml' }}

      - name: 自检 scTenifoldKnk 的空敲除处理
        # **不需要 R**：它拿假距离矩阵喂给 `compress_tenifold_distances()`
        # 和 `compare_engines()`，只验 Python 侧有没有把 R 侧那份结构证据
        # （`empty_knockout_genes`）正确消费成 None / 标记列。
        #
        # 为什么单独测这一段：scTenifoldKnk 敲除一个基因是把网络里那一行
        # 清零，若该基因**出度本来就是 0**，等于什么都没敲，包仍会返回
        # 一排 ~1e-16 的浮点噪声 —— **不报错、不给 NA**，读表的人只会
        # 得出"敲除这个基因没有影响"。所有既有图门禁都会通过，
        # 因为它们查的是"有没有产出"不是"产出对不对"。
        #
        # R 侧另有 `Rscript scripts/lib/tenifold_knk.R --selftest` 验出度
        # 计算；两边都必要 —— R 侧算对了而 Python 侧读丢了，症状一模一样。
        run: |
          python tools/selftest_tenifold.py

      - name: 检查图不是空白
        run: node tools/check_figures.mjs results/pbmc3k/figures

      # 出图名必须与代码阶段对应：`<阶段>-<模块>-<图>-unit<单元>-<名称>`。
      # **图名和脚本序号是两处，而"图名里的模块号写错了"没有任何东西能发现** ——
      # 图照样生成、CI 照样绿、验收照样过，只是读者按图名去 `scripts/` 里找
      # 对应代码时会找错文件。这正是"两处定义必然分叉"那一类。
      # 它也是**唯一**能发现"验收项还在查一个旧图名"的检查 ——
      # 实测 `main_analysis.py` 里 `virtual_perturbation_effect.png` 就是漏改的那个，
      # 而那种漏改会让验收项静默变成"永远 false"。
      - name: 检查出图名与代码阶段对应
        run: node tools/check_fig_names.mjs

      # 图幅（毫米）是否符合栏宽约定（规则 13）。
      # 上一步只看"有没有墨"，看不出图**有多宽** ——
      # 宽度随类别数增长的图（`max(...)` 只夹下限）会一直长下去，
      # 而它在"有墨迹"这个判据下永远是通过的。
      # 这里读 PDF 的 /MediaBox 换算成毫米，超出 W_DOUBLE 就红。
      - name: 检查图幅在栏宽以内
        run: node tools/check_fig_sizes.mjs results/pbmc3k/figures

      # 分辨率是否达到投稿底线（300 dpi）。
      # **上两步都看不出这个**：150 dpi 的图照样"有墨"、照样在 183 mm 以内，
      # 文件大小也正常 —— 只有放大或印刷时才发现字形发虚。
      # 而它最常见的成因不是画图代码，是**配置把默认值覆盖掉了**：
      # `ana.setdefault("figure_dpi", 300)` 只在键缺失时生效，而
      # `assets/config.pbmc3k.yml` 里显式写了这个键 —— 实测就踩过：
      # 只改了 `common.py`，CI 全绿，artifact 里的 PNG 仍是 907 px（150 dpi）。
      # 判据：dpi = PNG 像素数 / (PDF 的 /MediaBox 点数 / 72)，
      # 物理尺寸从 PDF 读、像素从 PNG 读，两边独立，算出来的是实测值。
      - name: 检查图分辨率达到 300 dpi
        run: node tools/check_fig_dpi.mjs results/pbmc3k/figures

      # 调色板：分类循环色够不够、两两分不分得开。
      # **上三步都看不出这个**：10 个簇配 5 个颜色时，图照样"有墨"、
      # 照样在 183 mm 以内、照样 300 dpi —— 只是 0≡5 / 1≡6 / …，
      # 图上簇 5 与簇 0 是**上下相邻的两个同色团块**，读者看不出分界。
      # 判据是算出来的，不是看出来的：两两 OKLCh 色相 >=15°、
      # 三种色盲下 OKLab 距离 >=0.05、白底对比度 >=2.0，
      # 外加 PAL_CYCLE 与 publication.mplstyle 的 axes.prop_cycle 必须逐色相同。
      - name: 检查调色板
        run: node tools/check_palette.mjs

      - name: 汇总产物
        if: always()
        run: |
          echo "===== results ====="
          find results -type f 2>/dev/null | sort | head -60 || true
          echo "===== data ====="
          find data -type f 2>/dev/null | sort | head -30 || true
          echo "===== 验收结论 ====="
          cat results/pbmc3k/acceptance.json 2>/dev/null | head -40 || echo "（无 acceptance.json）"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrna-results-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/pbmc3k/
            data/pbmc3k/raw.h5ad
            data/pbmc3k/qc_filtered.h5ad
            data/pbmc3k/integrated.h5ad
            data/pbmc3k/clustered.h5ad
            data/pbmc3k/dataset_info.json

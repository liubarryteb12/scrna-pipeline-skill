name: scRNA analysis

# ============================================================================
# 单细胞流水线 CI
# ============================================================================
# 设计原则（与 geo-normal-pipeline-skill 一致）：
#
#   1. **静态检查在前，装依赖在后。** 语法错误/规则违反 1 秒就能发现，
#      不该等 3 分钟装完 scanpy 才知道。
#
#   2. **产物必须上传。** 跑通但拿不到结果是没用的 —— 这条踩过坑：
#      artifact 的 path 清单和脚本实际写出的文件是两份独立的列表，
#      不一致时 job 绿但用户下载后缺文件。用 check_artifact_paths.mjs 兜住。
#
#   3. **图的检查在跑完之后。** 空白图只有真画出来才知道。
#
#   4. **可选步骤失败不让 job 变红，但要在验收清单里可见。**
#
#   5. 触发路径过滤：改 *.md / references/ 不触发 CI（省时间）。
#      **改了 scripts/ 或 workflow 本身才跑。**
# ============================================================================

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/scrna_analysis.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/scrna_analysis.yml"
  workflow_dispatch:
    inputs:
      config:
        description: "配置文件路径"
        required: false
        default: "assets/config.pbmc3k.yml"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 自设上限。GitHub 托管的硬上限是 6 小时；实测全流程 3-5 分钟，
    # 给 45 分钟留足余量（含装依赖）。
    timeout-minutes: 45

    # 把浮点结果钉死。**这是"设了种子也没用"的那一类随机源**，
    # 和 UMAP/leiden/scrublet 那些"没设种子"的不是一回事。
    #
    # **实测（六轮 CI，同一 Python 3.12、同一批包版本）**：
    #
    #   commit      并行度            dpt       palantir   scfates   拓扑     平均 rho
    #   8f3f56c0   无钉              +0.5856   +0.4674   +0.5644   4/6     +0.6363
    #   9af13b42   无钉              +0.5856   +0.4674   +0.5296   6/8     +0.6254  <- 只改注释
    #   5b241a3    下面 1)+2)        +0.5856   +0.4674   +0.5328   6/8     +0.6265
    #   db778bb    下面 1)+2)+3)     +0.5856   +0.4674   +0.5328   6/8     +0.6265
    #   f99eab1    同上              +0.5856   +0.4674   +0.5328   6/8     +0.6265
    #   e549477    同上              +0.5856   +0.4674   +0.5646   6/8     +0.6353
    #
    # **下面这三组变量不足以让 scFates 的 rho 可复现**（最后一行几乎回到
    # 未钉时的 +0.5644）。两次归因都被否证：
    #
    #   1) "多线程 BLAS 归约顺序" —— 钉住 1)+2) 后仍从 +0.5296 变 +0.5328
    #   2) "pynndescent 的 Numba 并行" —— 补上 3) 后三轮仍给
    #      +0.5328 / +0.5328 / +0.5646
    #
    # **它们确实修好了一件事：离散的拓扑稳住了** —— A 轮是 4 片段/6
    # milestone，之后六轮全部是 6 片段/8 milestone。所以不是白做，
    # **但不要以为设了就可复现。**
    #
    # `dpt` 与 `palantir` 六轮逐位相同，说明变量只在 scFates 那条路径上。
    # 残留随机源**尚未定位** —— 第三次动手前先读日志（AGENTS 规则 12），
    # 并把 `trajectory_status.json` 的 `reproducibility` 一起更新。
    #
    # 根因线索：`scFates.pp.diffusion`（1.2.5）**签名里没有 seed**，
    # 内部走 `palantir.run_diffusion_maps` → `compute_kernel(backend="scanpy")`
    # → scanpy 默认 `method="umap"`；然后 simpleppt 的 PPT 主曲线树
    # 把上游的末位差异放大成可见的 rho 变化。
    env:
      # 1) 线程数：多线程归约的求和顺序取决于线程调度，每次运行都不同。
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      # 2) 内核选择：OpenBLAS 在**运行期**按检测到的 CPU 型号分发 SIMD 内核
      #    （SSE/AVX2/AVX512 向量宽度不同 → 归约顺序不同 → 末位不同）。
      #    这一层线程数管不到；GitHub 托管 runner 的 CPU 型号在同一
      #    Azure 区域内也不单一。钉住内核类型后不再取决于宿主 CPU。
      OPENBLAS_CORETYPE: Haswell
      # 3) Numba 的线程池。**和上面两组是三个独立的旋钮** ——
      #    Numba 的 `prange` 线程数由它控制，不走 OMP/MKL。
      #    **但实测它也没解决 scFates 的漂移**（见上表最后一行）。
      NUMBA_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          # **不用 3.13/3.14。** harmonypy 等包在新版本上还没有 wheel，
          # 要从源码编译，且编译时常因缺 numpy 头文件失败（本地实测过）。
          # 3.12 上这些包都有现成 wheel。
          python-version: "3.12"

      - name: 静态检查（不装依赖）
        run: |
          node tools/check_py_syntax.mjs
          node tools/check_artifact_paths.mjs

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import scanpy, anndata, pydeseq2; print('核心依赖 OK')"

      - name: 显示环境
        run: |
          python -c "
          import importlib
          for m in ['scanpy','anndata','pydeseq2','harmonypy','skmisc','skimage',
                    'leidenalg','palantir','scFates']:
              try:
                  importlib.import_module(m); print('  OK  ', m)
              except Exception as e:
                  print('  --  ', m, type(e).__name__)
          "

      - name: 跑流水线
        run: |
          python scripts/main_analysis.py --config ${{ github.event.inputs.config || 'assets/config.pbmc3k.yml' }}

      - name: 自检拟bulk DE 代码路径
        # 单样本数据集会让 04 正确记 not_configured 并跳过 —— 那验证了
        # "正确跳过"，但没验证真正的 DESeq2 代码。这一步把它跑到。
        run: |
          python tools/selftest_pseudobulk.py --config ${{ github.event.inputs.config || 'assets/config.pbmc3k.yml' }}

      - name: 自检 §0.2 跨语言交接代码路径
        # 默认配置的 `perturbation.targets_csv` 是 null，所以每轮走的都是
        # **回退分支**（internal_top_regulons）—— 那验证了"正确回退"，
        # 但没验证真正的交接代码路径，包括 `record_cross_language()`
        # 到底有没有被调用。这一步造一份假的 Part 1 交接表把它跑到。
        #
        # **这条自检是有来历的**：`record_cross_language()` 在 `common.py`
        # 里定义了很久但一次都没被调用，清单的 `cross_language` 永远是
        # 空数组 —— 而空数组和"这一轮没有跨语言转换"长得一模一样。
        run: |
          python tools/selftest_part1_handoff.py --config ${{ github.event.inputs.config || 'assets/config.pbmc3k.yml' }}

      - name: 检查图不是空白
        run: node tools/check_figures.mjs results/pbmc3k/figures

      - name: 汇总产物
        if: always()
        run: |
          echo "===== results ====="
          find results -type f 2>/dev/null | sort | head -60 || true
          echo "===== data ====="
          find data -type f 2>/dev/null | sort | head -30 || true
          echo "===== 验收结论 ====="
          cat results/pbmc3k/acceptance.json 2>/dev/null | head -40 || echo "（无 acceptance.json）"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrna-results-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/pbmc3k/
            data/pbmc3k/raw.h5ad
            data/pbmc3k/qc_filtered.h5ad
            data/pbmc3k/integrated.h5ad
            data/pbmc3k/clustered.h5ad
            data/pbmc3k/dataset_info.json
